<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Registration — Built Environment PMET Summit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161f; --ink-soft: #565b6e; --canvas: #f4f5fb; --border: #e3e4ee;
    --primary: #1d4ed8; --primary-hover: #1a43bd; --primary-soft: #e8edfc;
    --good: #047857; --good-soft: #e3f8f0; --warn: #b45309; --warn-soft: #fef3e2;
    --danger: #dc2626; --danger-soft: #fdecec; --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
    --shadow: 0 20px 45px -25px rgba(20, 22, 31, 0.35);
    --font-display: "Space Grotesk", "Segoe UI", Arial, sans-serif;
    --font-body: "Inter", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--canvas); line-height: 1.5; min-height: 100vh; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  header.site-header { background: #0f1730; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-weight: 700; text-decoration: none; color: #fff; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), #4338ca); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.85rem; }
  .signed-in-as { font-size: 0.82rem; color: rgba(255,255,255,0.75); display: flex; align-items: center; gap: 0.8rem; }
  .signout-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.4rem 0.9rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
  .signout-btn:hover { background: rgba(255,255,255,0.18); }

  .container { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.25rem; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem; box-shadow: var(--shadow); }
  .panel h2 { font-size: 1.3rem; margin-bottom: 0.3rem; }
  .panel .sub { color: var(--ink-soft); font-size: 0.88rem; margin: 0 0 1.4rem; }

  .status-pill { display: inline-block; padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
  .status-registered { background-color: var(--primary-soft); color: var(--primary); }
  .status-waitlisted { background-color: var(--warn-soft); color: var(--warn); }
  .status-checked-in { background-color: var(--good-soft); color: var(--good); }

  .booking-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.25rem; margin-top: 1rem; }
  .booking-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.8rem; }
  .booking-time { font-size: 0.8rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 0.3rem; }
  .booking-title { font-weight: 700; font-size: 1.1rem; }
  .speaker-row { display: flex; align-items: center; gap: 0.7rem; margin-top: 1rem; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
  .speaker-name { font-size: 0.87rem; font-weight: 700; }
  .speaker-title { font-size: 0.76rem; color: var(--ink-soft); }

  .cancel-btn {
    margin-top: 1.5rem; width: 100%; background: #fff; color: var(--danger); border: 1px solid var(--danger-soft);
    padding: 0.7rem 1rem; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.92rem; cursor: pointer;
  }
  .cancel-btn:hover { background: var(--danger-soft); }
  .cancel-btn:disabled { opacity: 0.6; cursor: wait; }

  .empty-state { text-align: center; padding: 1.5rem 0; }
  .empty-state p { color: var(--ink-soft); margin: 0 0 1.2rem; }
  .empty-cta { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; padding: 0.7rem 1.4rem; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.92rem; }
  .empty-cta:hover { background: var(--primary-hover); }

  .loading-note { color: var(--ink-soft); font-size: 0.9rem; text-align: center; padding: 2rem 0; }
  .action-error { color: var(--danger); font-size: 0.85rem; margin-top: 0.7rem; min-height: 1em; text-align: center; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/summit"><span class="brand-mark" aria-hidden="true">BE</span>Built Environment PMET Summit</a>
  <div class="signed-in-as" id="signed-in-as" style="display:none;">
    <span id="signed-in-email"></span>
    <button class="signout-btn" id="signout-btn">Sign out</button>
  </div>
</header>

<div class="container">
  <div class="panel">
    <h2>My registration</h2>
    <p class="sub">Your booking for the Built Environment PMET Summit.</p>
    <div id="content"><div class="loading-note">Loading…</div></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://knglmtxdzgtepmrqmbdu.supabase.co';
  const PUBLISHABLE_KEY = 'sb_publishable_XNXOnZeJcOsszoFYwbjphw_J9AEHlOw';
  const supabase = createClient(SUPABASE_URL, PUBLISHABLE_KEY);

  const STATUSES = {
    registered:   { label: 'Registered',  class: 'status-registered' },
    waitlisted:   { label: 'Waitlisted',  class: 'status-waitlisted' },
    'checked-in': { label: 'Checked In',  class: 'status-checked-in' }
  };

  const content = document.getElementById('content');
  const signedInAs = document.getElementById('signed-in-as');
  const signedInEmail = document.getElementById('signed-in-email');
  const signoutBtn = document.getElementById('signout-btn');

  let currentUser = null;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatTime(hms) {
    const [h, m] = hms.split(':').map(Number);
    return new Date(2000, 0, 1, h, m).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  signoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = '/summit';
  });

  function renderSignedOut() {
    content.innerHTML = `
      <div class="empty-state">
        <p>Sign in to see your registration.</p>
        <a class="empty-cta" href="/register">Sign in / Register</a>
      </div>
    `;
  }

  function renderEmpty() {
    content.innerHTML = `
      <div class="empty-state">
        <p>You haven't registered for a session yet.</p>
        <a class="empty-cta" href="/register">Register now</a>
      </div>
    `;
  }

  function renderBooking(registration, session, track) {
    const statusMeta = STATUSES[registration.status] || STATUSES.registered;
    content.innerHTML = `
      <div class="booking-card">
        <div class="booking-top">
          <div>
            <div class="booking-time">${session.time}</div>
            <div class="booking-title">${escapeHtml(session.title)}</div>
          </div>
          <span class="status-pill ${statusMeta.class}">${statusMeta.label}</span>
        </div>
        <div class="speaker-row">
          <div class="avatar" style="background:${track.color}">${session.speaker.initials}</div>
          <div>
            <div class="speaker-name">${escapeHtml(session.speaker.name)}</div>
            <div class="speaker-title">${escapeHtml(session.speaker.title)}</div>
          </div>
        </div>
      </div>
      <button class="cancel-btn" id="cancel-btn">Cancel registration</button>
      <div class="action-error" id="action-error" role="alert"></div>
    `;

    document.getElementById('cancel-btn').addEventListener('click', async () => {
      if (!confirm('Cancel your registration for this session? This cannot be undone.')) return;
      const btn = document.getElementById('cancel-btn');
      const errEl = document.getElementById('action-error');
      btn.disabled = true;
      btn.textContent = 'Cancelling…';
      const { error } = await supabase.from('registrations').delete().eq('id', registration.id);
      if (error) {
        errEl.textContent = error.message || 'Could not cancel your registration.';
        btn.disabled = false;
        btn.textContent = 'Cancel registration';
        return;
      }
      renderEmpty();
    });
  }

  async function loadAndRender(user) {
    const { data: registration, error: regErr } = await supabase
      .from('registrations')
      .select('*')
      .eq('created_by', user.id)
      .maybeSingle();

    if (regErr) {
      content.innerHTML = `<p style="color:var(--danger)">Could not load your registration.</p>`;
      return;
    }
    if (!registration) { renderEmpty(); return; }

    const { data: sessionRow } = await supabase
      .from('sessions')
      .select('id,title,track_id,start_time,speaker:speakers(name,title,initials)')
      .eq('id', registration.session_id)
      .single();
    const { data: trackRow } = await supabase
      .from('tracks')
      .select('*')
      .eq('id', sessionRow.track_id)
      .single();

    const session = {
      title: sessionRow.title,
      time: formatTime(sessionRow.start_time),
      speaker: sessionRow.speaker
    };
    renderBooking(registration, session, trackRow);

    supabase
      .channel('my-registration-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'registrations', filter: `created_by=eq.${user.id}` }, () => {
        loadAndRender(user);
      })
      .subscribe();
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session?.user) { renderSignedOut(); return; }
    currentUser = session.user;
    signedInAs.style.display = 'flex';
    signedInEmail.textContent = currentUser.email;
    await loadAndRender(currentUser);
  }

  init();
</script>
</body>
</html>
